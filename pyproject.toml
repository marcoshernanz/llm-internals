[project]
name = "deepseek-v4-1-flash"
version = "0.0.0"
requires-python = ">=3.14"
dependencies = [
    "huggingface-hub>=2.2.0",
    "numpy>=2.5.3",
    "safetensors>=0.8.0",
    "tokenizers>=0.23.3",
    "torch>=2.14.0",
    "triton==3.8.0 ; sys_platform == 'linux'",
]

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "modal>=1.6.0",
    "pytest>=9.1.1",
    "ruff>=0.16.8",
    "transformers>=5.19.0",
    "ty>=0.0.81",
]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.format]
quote-style = "double"

[tool.ty.environment]
python = ".venv"
python-version = "3.14"
root = ["."]

[tool.ty.terminal]
error-on-warning = true

# ty can't match the types Triton gives its own functions (tl.sum, triton.next_power_of_2) or
# launch options such as num_warps, so these two rules are off where kernels live.
[[tool.ty.overrides]]
include = ["core/kernels/**"]

[tool.ty.overrides.rules]
invalid-argument-type = "ignore"
unknown-argument = "ignore"
