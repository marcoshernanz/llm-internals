[project]
name = "deepseek-v4-1-flash"
version = "0.0.0"
requires-python = ">=3.14"
dependencies = [
    "numpy>=2.5.3",
    "torch>=2.14.0",
    "triton==3.8.0 ; sys_platform == 'linux'",
]

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "modal>=1.6.0",
    "pytest>=9.1.1",
    "ruff>=0.16.8",
    "ty>=0.0.81",
]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.format]
quote-style = "double"

[tool.ty.environment]
python = ".venv"
python-version = "3.14"
root = ["."]

[tool.ty.terminal]
error-on-warning = true
